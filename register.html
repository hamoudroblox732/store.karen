
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAREN STORE | Roblox Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#11130f;color:#eee;font-family:Cairo,sans-serif;padding:20px}
.wrap{max-width:470px;margin:35px auto}
.logo{text-align:center;color:#c0c79e;font-size:30px;font-weight:900;margin-bottom:25px}
.card{background:#1b1f18;border:1px solid #343b2c;border-radius:17px;padding:23px;margin-bottom:18px}
h2{margin-top:0}
p{color:#a5ad95;font-size:14px;line-height:1.9}
label{font-size:13px;color:#c0c79e}
input{width:100%;padding:13px;margin:8px 0 15px;background:#11140f;color:white;border:1px solid #414735;border-radius:9px;font-family:inherit}
button{width:100%;padding:13px;border:0;border-radius:10px;font-family:inherit;font-weight:900;cursor:pointer;margin-top:9px}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#a3a785;color:#171912}
.secondary{background:#30372a;color:white}
.msg{font-size:13px;overflow-wrap:anywhere}
a{color:#c0c79e;text-decoration:none}
.profile{text-align:center;background:#151912;border:1px solid #414735;border-radius:14px;padding:20px;margin-top:18px}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#30372a;border:3px solid #a3a785}
.username{font-size:20px;font-weight:900;margin:10px 0 0;color:#e7e9d8}
.display{font-size:13px;color:#a5ad95;margin:3px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">KAREN STORE</div>

<div class="card">
<h2>اختر حساب Roblox</h2>
<p>اكتب اسم حساب Roblox للبحث عنه وعرض صورته قبل المتابعة.</p>

<label>اسم المستخدم</label>
<input id="username" maxlength="20" autocomplete="off"
placeholder="Roblox Username">

<button class="primary" id="searchBtn" onclick="searchAccount()">بحث عن الحساب</button>

<div id="profileBox" class="profile hidden">
<img id="avatar" class="avatar" alt="Roblox Avatar">
<div id="foundUsername" class="username"></div>
<div id="displayName" class="display"></div>

<button class="primary" onclick="confirmAccount()">
إيه، هذا حسابي — أكمل التسجيل
</button>

<button class="secondary" onclick="editAccount()">
لا، أعدّل اسم حسابي
</button>
</div>

<p id="message" class="msg"></p>
</div>

<div style="text-align:center">
<a href="index.html">العودة إلى KAREN STORE</a>
</div>
</div>

<script>
const SUPABASE_URL="https://jwikjdbqlzucmkihmyci.supabase.co";
const SUPABASE_KEY="sb_publishable_RWwEfQJdI0GHddFsqCSYRQ_KPGqRYR";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let selectedAccount=null;

const $=id=>document.getElementById(id);

async function searchAccount(){
 const username=$("username").value.trim();
 const message=$("message");
 const button=$("searchBtn");

 $("profileBox").classList.add("hidden");
 selectedAccount=null;

 if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){
  message.textContent="اكتب اسم مستخدم صحيحًا.";
  return;
 }

 button.disabled=true;
 message.textContent="جاري البحث عن الحساب...";

 try{
  const response=await fetch(
   "https://users.roblox.com/v1/usernames/users",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     usernames:[username],
     excludeBannedUsers:true
    })
   }
  );

  if(!response.ok)throw new Error("تعذر الاتصال بروبلوكس.");

  const result=await response.json();
  const account=result.data?.[0];

  if(!account){
   message.textContent="لم يتم العثور على هذا الحساب.";
   return;
  }

  const imageResponse=await fetch(
   "https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds="+
   account.id+"&size=150x150&format=Png&isCircular=true"
  );

  if(!imageResponse.ok)throw new Error("تعذر تحميل صورة الحساب.");

  const imageData=await imageResponse.json();
  const image=imageData.data?.[0]?.imageUrl;

  if(!image)throw new Error("صورة الحساب غير متاحة.");

  selectedAccount={
   id:account.id,
   username:account.name,
   displayName:account.displayName,
   avatar:image
  };

  $("avatar").src=image;
  $("foundUsername").textContent="@"+account.name;
  $("displayName").textContent="الاسم الظاهر: "+account.displayName;

  $("profileBox").classList.remove("hidden");
  message.textContent="تم العثور على الحساب. تأكد أنه الحساب الذي تقصده.";

 }catch(error){
  message.textContent=error.message||"حدث خطأ أثناء البحث.";
 }finally{
  button.disabled=false;
 }
}

function editAccount(){
 selectedAccount=null;
 $("profileBox").classList.add("hidden");
 $("username").focus();
 $("message").textContent="عدّل الاسم وابحث مرة أخرى.";
}

function confirmAccount(){
 if(!selectedAccount)return;

 sessionStorage.setItem(
  "karen_selected_roblox",
  JSON.stringify(selectedAccount)
 );

 $("message").textContent=
  "تم تأكيد اختيار الحساب. هذا يؤكد اختيار الاسم فقط ولا يثبت ملكية الحساب.";
 alert("تم اختيار الحساب بنجاح.");

 location.href="index.html";
}
</script>
</body>
</html>
