
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAREN STORE | Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#11130f;color:#eee;font-family:Cairo,sans-serif;padding:20px}
.wrap{max-width:470px;margin:35px auto}
.logo{text-align:center;color:#c0c79e;font-size:30px;font-weight:900;margin-bottom:25px}
.card{background:#1b1f18;border:1px solid #343b2c;border-radius:17px;padding:23px;margin-bottom:18px}
h2{margin-top:0}
p{color:#a5ad95;font-size:14px;line-height:1.9}
label{font-size:13px;color:#c0c79e}
input{width:100%;padding:13px;margin:8px 0 15px;background:#11140f;color:white;border:1px solid #414735;border-radius:9px;font-family:inherit}
button{width:100%;padding:13px;border:0;border-radius:10px;font-family:inherit;font-weight:900;cursor:pointer;margin-top:9px}
.primary{background:#a3a785;color:#171912}
.secondary{background:#30372a;color:white}
.msg{font-size:13px;overflow-wrap:anywhere}
a{color:#c0c79e;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">KAREN STORE</div>
<div class="card">
<h2>مرحبًا بك</h2>
<p>سجّل الدخول أو أنشئ حسابك للبدء بالتسوق وحفظ طلباتك.</p>
<label>البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="email" placeholder="example@email.com">
<label>كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="8 أحرف على الأقل">
<button class="primary" onclick="register()">إنشاء حساب</button>
<button class="secondary" onclick="login()">تسجيل الدخول</button>
<p id="authMessage" class="msg"></p>
</div>
<div class="card">
<h2>اسم حساب Roblox</h2>
<p>أدخل اسم حسابك. يجب أن يتكون من 4 أحرف على الأقل.</p>
<label>Roblox Username</label>
<input id="roblox" maxlength="30" placeholder="Ahmad_roblox2222">
<button class="primary" onclick="saveUsername()">حفظ اسم الحساب</button>
<p id="robloxMessage" class="msg"></p>
</div>
<div style="text-align:center"><a href="index.html">العودة إلى KAREN STORE</a></div>
</div>
<script>
const SUPABASE_URL="https://jwikjdbqlzucmkihmyci.supabase.co";
const SUPABASE_KEY="sb_publishable_RWwEfQJdI0GHddFsqCSYR_KPGqRYR";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function register(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||password.length<8){document.getElementById("authMessage").textContent="أدخل بريدًا صحيحًا وكلمة مرور من 8 أحرف على الأقل.";return}
 const {data,error}=await db.auth.signUp({email,password});
 document.getElementById("authMessage").textContent=error?error.message:"تم إنشاء الحساب. إذا طُلب منك تأكيد البريد، افتح رسالة التأكيد.";
 if(data.session){document.getElementById("authMessage").textContent="تم إنشاء الحساب وتسجيل الدخول."}
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 document.getElementById("authMessage").textContent=error?error.message:"تم تسجيل الدخول بنجاح.";
 if(!error)setTimeout(()=>location.href="index.html",700);
}

async function saveUsername(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){document.getElementById("robloxMessage").textContent="سجّل الدخول أولًا.";return}
 const name=document.getElementById("roblox").value.trim();
 if(name.length<4){document.getElementById("robloxMessage").textContent="الاسم يجب أن يكون 4 أحرف على الأقل.";return}
 const {error}=await db.rpc("set_my_roblox_username",{p_username:name});
 document.getElementById("robloxMessage").textContent=error?error.message:"تم حفظ اسم Roblox بنجاح.";
}
async function init(){
 const {data:{session}}=await db.auth.getSession();
 if(session){
  const {data:p}=await db.from("profiles").select("roblox_username").eq("id",session.user.id).maybeSingle();
  if(p?.roblox_username)document.getElementById("roblox").value=p.roblox_username;
  document.getElementById("authMessage").textContent="أنت مسجل الدخول بالفعل.";
 }
}
init();
</script>
</body>
</html>
