
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAREN STORE | Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#11130f;color:#eee;font-family:Cairo,sans-serif;padding:20px}
.wrap{max-width:470px;margin:35px auto}
.logo{text-align:center;color:#c0c79e;font-size:30px;font-weight:900;margin-bottom:25px}
.card{background:#1b1f18;border:1px solid #343b2c;border-radius:17px;padding:23px;margin-bottom:18px}
h2{margin-top:0}
p{color:#a5ad95;font-size:14px;line-height:1.9}
label{font-size:13px;color:#c0c79e}
input{width:100%;padding:13px;margin:8px 0 15px;background:#11140f;color:white;border:1px solid #414735;border-radius:9px;font-family:inherit}
button{width:100%;padding:13px;border:0;border-radius:10px;font-family:inherit;font-weight:900;cursor:pointer;margin-top:9px}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#a3a785;color:#171912}
.secondary{background:#30372a;color:white}
.msg{font-size:13px;overflow-wrap:anywhere}
a{color:#c0c79e;text-decoration:none}
.hidden{display:none!important}
.profile{display:flex;align-items:center;gap:13px;background:#252b20;padding:12px;border-radius:12px;margin:12px 0}
.profile img{width:65px;height:65px;border-radius:50%;object-fit:cover;background:#30372a}
.profile-info{min-width:0}
.profile-info b{display:block;overflow-wrap:anywhere}
.profile-info small{color:#a5ad95}
</style>
</head>
<body>
<div class="wrap">
 <div class="logo">KAREN STORE</div>

 <div class="card">
  <h2>مرحبًا بك</h2>
  <p>اكتب اسم حساب Roblox للبحث عنه وعرض صورته قبل المتابعة.</p>

  <label>Roblox Username</label>
  <input id="roblox" maxlength="20" autocomplete="off" placeholder="اكتب اسم حسابك">

  <button class="primary" id="searchButton" onclick="searchAccount()">البحث عن الحساب</button>

  <div id="profileBox" class="hidden">
   <div class="profile">
    <img id="avatar" alt="Roblox Avatar">
    <div class="profile-info">
     <b id="displayName"></b>
     <small id="username"></small>
    </div>
   </div>
   <p>هل هذا حسابك؟</p>
   <button class="primary" onclick="confirmAccount()">إيه، هذا حسابي — أكمل</button>
   <button class="secondary" onclick="editUsername()">لا، أعدّل اسم حسابي</button>
  </div>

  <div id="passwordBox" class="hidden">
   <label>كلمة مرور الأونر</label>
   <input id="ownerPassword" type="password" autocomplete="current-password" placeholder="كلمة مرور الأونر">
   <button class="primary" id="ownerButton" onclick="ownerLogin()">دخول الأونر</button>
  </div>

  <p id="message" class="msg"></p>
 </div>

 <div class="card hidden" id="normalAuth">
  <h2>حساب المتجر</h2>
  <p id="accountName"></p>

  <label>كلمة المرور</label>
  <input id="password" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل">

  <button class="primary" id="registerButton" onclick="register()">إنشاء حساب</button>
  <button class="secondary" id="loginButton" onclick="login()">تسجيل الدخول</button>
  <p id="authMessage" class="msg"></p>
 </div>

 <div style="text-align:center">
  <a href="index.html">العودة إلى KAREN STORE</a>
 </div>
</div>

<script>
const SUPABASE_URL="https://jwikjdbqlzucmkihmyci.supabase.co";
const SUPABASE_KEY="sb_publishable_RWwEfQJdI0GHddFsqCSYRQ_KGPGqRYR";
const ROBLOX_LOOKUP_URL=SUPABASE_URL+"/functions/v1/roblox-lookup";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let selectedAccount=null;
let searching=false;

function message(text){
 $("message").textContent=text;
}

function internalEmail(account){
 return "rbx_"+account.id+"@users.karen-store.invalid";
}

async function searchAccount(){
 if(searching)return;

 const name=$("roblox").value.trim();

 if(name.length<4){
  message("اسم الحساب يجب أن يتكون من 4 أحرف على الأقل.");
  return;
 }

 if(name.length>20||!/^[a-zA-Z0-9_]+$/.test(name)){
  message("استخدم من 4 إلى 20 حرفًا أو رقمًا أو شرطة سفلية فقط.");
  return;
 }

 searching=true;
 $("searchButton").disabled=true;
 $("searchButton").textContent="جاري البحث...";
 $("profileBox").classList.add("hidden");
 $("passwordBox").classList.add("hidden");
 $("normalAuth").classList.add("hidden");
 selectedAccount=null;
 message("جاري الاتصال بخدمة البحث...");

 try{
  const response=await fetch(ROBLOX_LOOKUP_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY
   },
   body:JSON.stringify({username:name})
  });

  const raw=await response.text();
  let result;

  try{
   result=JSON.parse(raw);
  }catch{
   throw new Error("رد غير مفهوم من الخادم: "+raw.slice(0,250));
  }

  if(!response.ok){
   throw new Error("HTTP "+response.status+": "+(result.error||result.message||raw));
  }

  const account=result.user;

  if(!result.success||!account||!account.id){
   throw new Error(result.error||"لم يتم العثور على الحساب.");
  }

  selectedAccount={
   id:account.id,
   name:account.name,
   displayName:account.displayName
  };

  $("avatar").src=account.avatar||
   "https://www.roblox.com/headshot-thumbnail/image?userId="+account.id+"&width=150&height=150&format=png";

  $("displayName").textContent=account.displayName||account.name;
  $("username").textContent="@"+account.name;

  $("profileBox").classList.remove("hidden");
  message("تم العثور على الحساب. تأكد من أنه الحساب الصحيح.");

 }catch(error){
  message("تفاصيل الخطأ: "+(error.message||"تعذر تحميل الحساب."));
 }finally{
  searching=false;
  $("searchButton").disabled=false;
  $("searchButton").textContent="البحث عن الحساب";
 }
}

function editUsername(){
 selectedAccount=null;
 $("profileBox").classList.add("hidden");
 $("passwordBox").classList.add("hidden");
 $("normalAuth").classList.add("hidden");
 $("ownerPassword").value="";
 $("password").value="";
 $("roblox").focus();
 message("عدّل الاسم ثم ابحث مرة أخرى.");
}

function confirmAccount(){
 if(!selectedAccount)return;

 if(selectedAccount.name.toLowerCase()==="ahmad_roblox2222"){
  $("passwordBox").classList.remove("hidden");
  $("normalAuth").classList.add("hidden");
  message("أدخل كلمة مرور الأونر للمتابعة.");
  return;
 }

 $("normalAuth").classList.remove("hidden");
 $("accountName").textContent="الحساب المحدد: @"+selectedAccount.name;
 $("password").value="";
 $("authMessage").textContent="أنشئ حسابًا جديدًا أو سجّل دخولك.";
 $("normalAuth").scrollIntoView({behavior:"smooth"});
}

async function ownerLogin(){
 if(!selectedAccount||
    selectedAccount.name.toLowerCase()!=="ahmad_roblox2222"){
  message("اختر حساب الأونر أولًا.");
  return;
 }

 const password=$("ownerPassword").value;

 if(!password){
  message("أدخل كلمة المرور.");
  return;
 }

 $("ownerButton").disabled=true;
 $("ownerButton").textContent="جاري التحقق...";
 message("");

 try{
  const response=await fetch(SUPABASE_URL+"/functions/v1/owner-login",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   },
   body:JSON.stringify({
    username:selectedAccount.name,
    password:password
   })
  });

  const raw=await response.text();
  let result;

  try{
   result=JSON.parse(raw);
  }catch{
   throw new Error("رد غير مفهوم من خدمة الأونر.");
  }

  if(!response.ok){
   throw new Error(result.error||result.message||"فشل تسجيل دخول الأونر.");
  }

  if(!result.session?.access_token||!result.session?.refresh_token){
   throw new Error("لم يرجع الخادم جلسة دخول صحيحة.");
  }

  const {error}=await db.auth.setSession({
   access_token:result.session.access_token,
   refresh_token:result.session.refresh_token
  });

  if(error)throw error;

  location.href="admin.html";

 }catch(error){
  message(error.message||"تعذر تسجيل الدخول.");
 }finally{
  $("ownerButton").disabled=false;
  $("ownerButton").textContent="دخول الأونر";
 }
}

async function register(){
 if(!selectedAccount){
  $("authMessage").textContent="ابحث عن حساب Roblox وأكّده أولًا.";
  return;
 }

 const password=$("password").value;

 if(password.length<8){
  $("authMessage").textContent="كلمة المرور يجب أن تكون 8 أحرف على الأقل.";
  return;
 }

 $("registerButton").disabled=true;
 $("loginButton").disabled=true;

 try{
  const {data,error}=await db.auth.signUp({
   email:internalEmail(selectedAccount),
   password
  });

  if(error)throw error;

  if(!data.session){
   $("authMessage").textContent="لم يتم إنشاء جلسة دخول. تأكد من إيقاف تأكيد البريد في إعدادات Supabase.";
   return;
  }

  if(!await saveSelectedUsername())return;

  location.href="index.html";

 }catch(error){
  $("authMessage").textContent=error.message;
 }finally{
  $("registerButton").disabled=false;
  $("loginButton").disabled=false;
 }
}

async function login(){
 if(!selectedAccount){
  $("authMessage").textContent="ابحث عن حساب Roblox وأكّده أولًا.";
  return;
 }

 const password=$("password").value;

 if(!password){
  $("authMessage").textContent="أدخل كلمة المرور.";
  return;
 }

 $("loginButton").disabled=true;
 $("registerButton").disabled=true;

 try{
  const {error}=await db.auth.signInWithPassword({
   email:internalEmail(selectedAccount),
   password
  });

  if(error)throw error;

  if(!await saveSelectedUsername())return;

  location.href="index.html";

 }catch(error){
  $("authMessage").textContent=error.message;
 }finally{
  $("loginButton").disabled=false;
  $("registerButton").disabled=false;
 }
}

async function saveSelectedUsername(){
 const {data:{user},error:authError}=await db.auth.getUser();

 if(authError||!user){
  $("authMessage").textContent="تعذر التحقق من جلسة الدخول.";
  return false;
 }

 const {error}=await db.rpc("set_my_roblox_username",{
  p_username:selectedAccount.name
 });

 if(error){
  $("authMessage").textContent="تعذر حفظ اسم Roblox: "+error.message;
  return false;
 }

 return true;
}

async function init(){
 const {data:{session}}=await db.auth.getSession();

 if(session){
  $("normalAuth").classList.remove("hidden");
  $("authMessage").textContent="أنت مسجل الدخول بالفعل.";

  const {data:p}=await db.from("profiles")
   .select("roblox_username")
   .eq("id",session.user.id)
   .maybeSingle();

  if(p?.roblox_username){
   $("roblox").value=p.roblox_username;
  }
 }
}

init();
</script>
</body>
</html>
